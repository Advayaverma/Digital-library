<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Library</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <style>
        body {
            background: url('../public/pexels-repuding-12064.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        .container {
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
        }

        .form-control,
        .btn {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="text-center">User Dashboard</h2>
        <button class="btn btn-danger float-right" onclick="logout()">Logout</button>
        <hr>

        <!-- Search Books -->
        <input class="form-control mb-3" id="searchTxt" type="search"
            placeholder="Search Books by Name, Author, or Genre" onkeyup="searchBook()">

        <!-- Available Books -->
        <h3>Available Books</h3>
        <table class="table table-dark mt-3">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <!-- Borrowed Books -->
        <h3>Borrowed Books</h3>
        <table class="table table-dark mt-3">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Due Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="borrowedBody"></tbody>
        </table>

        <!-- Returned Books -->
        <h3>Returned Books</h3>
        <table class="table table-dark mt-3">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Due Date</th>
                    <th>Return Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="returnedBody"></tbody>
        </table>
    </div>

    <script>
        function displayBooks(filteredBooks = null) {
            let books = JSON.parse(localStorage.getItem("books")) || [];
            let borrowedBooks = JSON.parse(localStorage.getItem("borrowedBooks")) || [];
            let returnedBooks = JSON.parse(localStorage.getItem("returnedBooks")) || [];

            let tableBody = document.getElementById('tableBody');
            let borrowedBody = document.getElementById('borrowedBody');
            let returnedBody = document.getElementById('returnedBody');

            let availableBooks = books.filter(book =>
                !borrowedBooks.some(borrowed => borrowed.name === book.name)
            );

            // Use filtered books if searching
            if (filteredBooks !== null) {
                availableBooks = filteredBooks;
            }

            tableBody.innerHTML = availableBooks.length ?
                availableBooks.map((book, index) => `<tr>
                    <td>${book.name}</td>
                    <td>${book.author}</td>
                    <td>${book.genre}</td>
                    <td><button class="btn btn-success" onclick="borrowBook(${index})">Borrow</button></td>
                </tr>`).join('') : "<tr><td colspan='4' class='text-center'>No books available</td></tr>";

            borrowedBody.innerHTML = borrowedBooks.length ?
                borrowedBooks.map((book, index) => `<tr>
                    <td>${book.name}</td>
                    <td>${book.author}</td>
                    <td>${book.genre}</td>
                    <td>${book.dueDate}</td>
                    <td><button class="btn btn-warning" onclick="returnBook(${index})">Return</button></td>
                </tr>`).join('') : "<tr><td colspan='5' class='text-center'>No borrowed books</td></tr>";

            returnedBody.innerHTML = returnedBooks.length ?
                returnedBooks.map((book, index) => `<tr>
                    <td>${book.name}</td>
                    <td>${book.author}</td>
                    <td>${book.dueDate}</td>
                    <td>${book.returnDate}</td>
                    <td><button class="btn btn-danger" onclick="deleteReturnedBook(${index})">Delete</button></td>
                </tr>`).join('') : "<tr><td colspan='5' class='text-center'>No returned books</td></tr>";
        }

        function searchBook() {
            let searchText = document.getElementById('searchTxt').value.toLowerCase();
            let books = JSON.parse(localStorage.getItem("books")) || [];

            let filteredBooks = books.filter(book =>
                book.name.toLowerCase().includes(searchText) ||
                book.author.toLowerCase().includes(searchText) ||
                book.genre.toLowerCase().includes(searchText) // Added genre search
            );

            displayBooks(filteredBooks);
        }

        function borrowBook(index) {
            let books = JSON.parse(localStorage.getItem("books")) || [];
            let borrowedBooks = JSON.parse(localStorage.getItem("borrowedBooks")) || [];

            let availableBooks = books.filter(book =>
                !borrowedBooks.some(borrowed => borrowed.name === book.name)
            );

            let book = availableBooks[index];

            let days = parseInt(prompt("Enter the number of days you want to borrow the book:"));
            if (!days || days <= 0) {
                alert("Invalid number of days. Please enter a positive number.");
                return;
            }

            let today = new Date();
            let dueDate = new Date(today);
            dueDate.setDate(today.getDate() + days);

            book.dueDate = dueDate.toISOString().split('T')[0];

            borrowedBooks.push(book);
            localStorage.setItem("borrowedBooks", JSON.stringify(borrowedBooks));

            displayBooks();
        }

        function returnBook(index) {
            let borrowedBooks = JSON.parse(localStorage.getItem("borrowedBooks")) || [];
            let returnedBooks = JSON.parse(localStorage.getItem("returnedBooks")) || [];

            let book = borrowedBooks[index];

            let today = new Date();
            let returnDate = today.toISOString().split('T')[0]; // Capture today's date as return date

            let dueDate = new Date(book.dueDate);
            let delayDays = Math.max(0, Math.ceil((today - dueDate) / (1000 * 60 * 60 * 24))); // Calculate delay

            book.returnDate = returnDate;

            returnedBooks.push(book);
            borrowedBooks.splice(index, 1);

            localStorage.setItem("borrowedBooks", JSON.stringify(borrowedBooks));
            localStorage.setItem("returnedBooks", JSON.stringify(returnedBooks));

            alert(`Book: ${book.name} \nReturned on: ${returnDate} \nDue Date was: ${book.dueDate} \n${delayDays > 0 ? "⚠ Delayed by " + delayDays + " days!" : "✅ Returned on time!"}`);

            displayBooks();
        }

        function deleteReturnedBook(index) {
            let returnedBooks = JSON.parse(localStorage.getItem("returnedBooks")) || [];
            returnedBooks.splice(index, 1);
            localStorage.setItem("returnedBooks", JSON.stringify(returnedBooks));
            displayBooks();
        }

        function logout() {
            window.location.href = "login.html";
        }

        async function loadBooksFromCSV() {
            if (localStorage.getItem("csvLoaded") === "true") return;
            let books = JSON.parse(localStorage.getItem("books")) || [];
            if (books.length > 0) {
                localStorage.setItem("csvLoaded", "true");
                return;
            }

            let tableBody = document.getElementById('tableBody');
            if (tableBody) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center">
                    <div class="spinner-border text-light" role="status" style="width: 1.5rem; height: 1.5rem;">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <span class="ml-2">Preloading random books from CSV...</span>
                </td></tr>`;
            }

            try {
                const fileSize = 77800000;
                const chunkSize = 500 * 1024; // 500 KB
                const maxStart = fileSize - chunkSize - 2000;
                const startByte = Math.max(0, Math.floor(Math.random() * maxStart));
                const endByte = startByte + chunkSize;

                const response = await fetch('../public/books.csv', {
                    headers: {
                        'Range': `bytes=${startByte}-${endByte}`
                    }
                });

                let text = '';
                if (response.status === 206) {
                    text = await response.text();
                } else {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let bytesRead = 0;
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        text += decoder.decode(value, { stream: true });
                        bytesRead += value.length;
                        if (bytesRead >= chunkSize) {
                            reader.cancel();
                            break;
                        }
                    }
                }

                const lines = text.split('\n');
                const startIdx = (response.status === 206 && startByte > 0) ? 1 : 1;

                const parsedBooks = [];
                const genres = ["Fiction", "Mystery", "Sci-Fi", "Biography", "History", "Fantasy", "Romance", "Thriller"];

                for (let i = startIdx; i < lines.length - 1; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const parts = line.split('";"');
                    if (parts.length < 3) continue;

                    const isbn = parts[0].replace(/^"/, '').trim();
                    const title = parts[1].trim();
                    const author = parts[2].trim();

                    let hash = 0;
                    for (let j = 0; j < isbn.length; j++) {
                        hash = isbn.charCodeAt(j) + ((hash << 5) - hash);
                    }
                    const genre = genres[Math.abs(hash) % genres.length];

                    parsedBooks.push({
                        id: isbn || (Date.now() + i),
                        name: title,
                        author: author,
                        genre: genre
                    });
                }

                if (parsedBooks.length > 0) {
                    localStorage.setItem("books", JSON.stringify(parsedBooks));
                    localStorage.setItem("csvLoaded", "true");
                } else {
                    throw new Error("No books parsed.");
                }

            } catch (error) {
                console.error("Error preloading books:", error);
                const fallbackBooks = [
                    { id: "0195153448", name: "Classical Mythology", author: "Mark P. O. Morford", genre: "Mythology" },
                    { id: "0002005018", name: "Clara Callan", author: "Richard Bruce Wright", genre: "Fiction" },
                    { id: "0060973129", name: "Decision in Normandy", author: "Carlo D'Este", genre: "History" },
                    { id: "0374157065", name: "Flu: Great Influenza Pandemic of 1918", author: "Gina Bari Kolata", genre: "Science" }
                ];
                localStorage.setItem("books", JSON.stringify(fallbackBooks));
                localStorage.setItem("csvLoaded", "true");
            }
        }

        document.addEventListener("DOMContentLoaded", async function () {
            await loadBooksFromCSV();
            displayBooks();
        });
    </script>
</body>

</html>
